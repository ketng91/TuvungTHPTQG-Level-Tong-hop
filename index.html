// Bắt sự kiện Enter cho tất cả các ô input trong bài tập
document.addEventListener("DOMContentLoaded", function() {
  const exerciseInputs = document.querySelectorAll(".exercise input");

  exerciseInputs.forEach(input => {
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {      // Kiểm tra nếu nhấn Enter
        e.preventDefault();          // Ngăn việc xuống dòng mặc định
        const checkBtn = this.nextElementSibling; // giả định nút Check ngay sau input
        if (checkBtn && checkBtn.tagName === "BUTTON") {
          checkBtn.click();         // kích hoạt nút Check
        }
      }
    });
  });
});
</script>

<script>
const selectEl = document.getElementById("wordList");

function sortOptionsByNumber() {
  const opts = Array.from(selectEl.options);

opts.sort((a, b) => {

    const getKey = v => {
        const m = v.match(/^(\d+)([A-Z]?)$/);

        return {
            num: parseInt(m[1]),
            letter: m[2] || ""
        };
    };

    const x = getKey(a.value);
    const y = getKey(b.value);

    if (x.num !== y.num)
        return x.num - y.num;

    return x.letter.localeCompare(y.letter);

});

  selectEl.innerHTML = "";
  opts.forEach(o => selectEl.appendChild(o));
}

// sort ngay khi load
sortOptionsByNumber();

// sort lại khi mở dropdown
selectEl.addEventListener("mousedown", sortOptionsByNumber);
selectEl.addEventListener("touchstart", sortOptionsByNumber);
</script>

let currList = 1, listCopy=[], index=0;
    listCopy = [],
    index = 0;

let totalWords = 0;
let knownCount = 0;

let reviewMode = "vn-en";

// Trạng thái Hiện / Ẩn nghĩa
let meaningsVisible = true;

/********** LOAD LIST **********/
function loadList(){

  currList = document.getElementById("wordList").value;

  listCopy = [...data[currList]];

  totalWords = listCopy.length;

  knownCount = 0;

  updateCounter();

  renderWords();

  loadExercises();

  setMode(reviewMode);

}

function updateCounter(){
  document.getElementById("progressCounter").innerText =
    `Đã biết ${knownCount} / ${totalWords}`;
}
function setMode(mode){

   reviewMode = mode;

   document.getElementById("btnVNEN")
      .style.background =
      mode==="vn-en"
      ? "#ffb3ba"
      : "#a0e7e5";

   document.getElementById("btnENVN")
      .style.background =
      mode==="en-vn"
      ? "#ffb3ba"
      : "#a0e7e5";

   nextWord();

}

document.getElementById("wordList").onchange = loadList;
loadList();

function speakWord(text){

  speechSynthesis.cancel();

  let cleanText = text;

  // bỏ phiên âm /.../
  cleanText = cleanText.split("/")[0];

  // bỏ loại từ (n), (v), (adj), (phr v)...
  cleanText = cleanText.replace(/\(.*?\)/g,"").trim();

  const utter = new SpeechSynthesisUtterance(cleanText);

  utter.lang = "en-US";
  utter.rate = 1;
  utter.pitch = 1;
  utter.volume = 1;

  speechSynthesis.speak(utter);
}

/********** RENDER & SORT **********/
function renderWords(){

  const box = document.getElementById("wordContainer");

  box.innerHTML = "";

  // Nếu đang ở chế độ ẩn nghĩa
  // thì danh sách mới cũng phải ẩn nghĩa
  if (!meaningsVisible) {
      box.classList.add("hide-all-meanings");
  } else {
      box.classList.remove("hide-all-meanings");
  }


  let sorted = [...data[currList]].sort((a,b)=>b.tick - a.tick);

  sorted.forEach(item=>{

    let realIndex = data[currList].indexOf(item);

    box.innerHTML += `
      <div class="word-row">

        <span class="word-text">

          <span 
            class="en-word"
            onclick="toggleOneMeaning(this)"
            title="Click để hiện / ẩn nghĩa"
          >
            ${item.en}:
          </span>

          <span class="vn-word">
            ${item.vn}
          </span>

          <i class="fa-solid fa-volume-high speaker-icon"
             onclick="event.stopPropagation();speakWord(\`${item.en}\`)">
          </i>

        </span>

        <input
          type="checkbox"
          ${item.tick ? "checked" : ""}
          onclick="event.stopPropagation(); toggleTick(${realIndex})">

      </div>
    `;
  });

}

/********** HIỆN / ẨN NGHĨA **********/

// Nút Hiện / Ẩn toàn bộ nghĩa
function toggleAllMeanings() {

    const wordList = document.getElementById("wordContainer");
    const button = document.getElementById("toggleMeaningBtn");
    const meanings = wordList.querySelectorAll(".vn-word");

    meaningsVisible = !meaningsVisible;

    if (meaningsVisible) {

        // HIỆN TẤT CẢ
        wordList.classList.remove("hide-all-meanings");

        meanings.forEach(word => {
            word.classList.remove("show-individual");
            word.style.visibility = "visible";
        });

        button.innerHTML = "🙈 Ẩn nghĩa";

    } else {

        // ẨN TẤT CẢ
        wordList.classList.add("hide-all-meanings");

        meanings.forEach(word => {
            word.classList.remove("show-individual");
            word.style.visibility = "";
        });

        button.innerHTML = "👁️ Hiện nghĩa";
    }
}


// Click từng từ tiếng Anh
function toggleOneMeaning(enWord) {

    const vnWord = enWord.nextElementSibling;

    if (!vnWord) return;


    // Nếu đang ẨN TOÀN BỘ
    // click từ nào thì hiện riêng nghĩa từ đó
    if (!meaningsVisible) {

        vnWord.classList.toggle("show-individual");

    } 
    
    // Nếu đang HIỆN TOÀN BỘ
    // click từ nào thì ẩn / hiện riêng từ đó
    else {

        if (vnWord.style.visibility === "hidden") {

            vnWord.style.visibility = "visible";

        } else {

            vnWord.style.visibility = "hidden";

        }

    }
}

/********** TICK UPDATE **********/
function toggleTick(realIndex){
  data[currList][realIndex].tick = !data[currList][realIndex].tick;
  renderWords();
}

/********** REVIEW **********/
function nextWord(){
  document.getElementById("answer").innerHTML="";
  if(listCopy.length===0){
    document.getElementById("vietWord").innerHTML="🎉 Bạn đã học xong hết!";
    return;
  }
  index=Math.floor(Math.random()*listCopy.length);
if(reviewMode==="vn-en"){

document.getElementById("vietWord").innerHTML =
listCopy[index].vn;

}
else{

document.getElementById("vietWord").innerHTML =
listCopy[index].en;

}
}

function know(){
  firework();
  knownCount++;
  listCopy.splice(index,1);
  updateCounter();
  nextWord();
}

function dontKnow(){

if(reviewMode==="vn-en"){

document.getElementById("answer").innerHTML =
listCopy[index].en;

}
else{

document.getElementById("answer").innerHTML =
listCopy[index].vn;

}

}
/********** EXERCISES **********/
function loadExercises(){
  const box=document.getElementById("exercise");
  box.innerHTML="";
  exercises[currList].forEach((item,i)=>{
    box.innerHTML+=`
    <div style="margin:10px 0;">
      ${i+1}. ${item.q}
      <input id="ex${i}">
      <button onclick="checkEx(${i})">Check</button>
      <span id="res${i}" class="result"></span>
    </div>`;
  });
}

function checkEx(i){
  const user = document.getElementById("ex"+i).value.trim().toLowerCase();
  const ans = exercises[currList][i].a.toLowerCase();
  const box = document.getElementById("res"+i);

  if(user === ans) {
    box.innerHTML = "✔ Correct";
    box.style.color = "#28a745"; // chữ Correct màu xanh lá
    firework(); // gọi pháo hoa
  } else {
    box.innerHTML = "✘ " + exercises[currList][i].a;
    box.style.color = "#D02752"; // chữ sai màu đỏ
  }
}

/********** FIREWORK **********/
function firework(){
  for(let i=0;i<25;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.setProperty("--x",(Math.random()-.5)*600+"px");
    c.style.setProperty("--y",(Math.random()-.5)*600+"px");
    c.style.backgroundColor=`hsl(${Math.random()*360},90%,60%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),900);
  }
}
</script>
